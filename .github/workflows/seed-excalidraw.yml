name: Seed Excalidraw

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mirror Excalidraw history
        run: |
          git clone --mirror https://github.com/excalidraw/excalidraw.git source.git
          cd source.git
          git push --force --all https://x-access-token:{{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push --force --tags https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
